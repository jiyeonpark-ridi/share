<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>지연의 공유 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 줄 목록. 최신 항목이 위로 */
:root {
  --bg: #F3F4F7; --panel: #FFFFFF; --ink: #14171C; --ink-2: #545763; --line: #DEE3EB; --accent: #4D4AFF;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0D0F12; --panel: #14171C; --ink: #EDF0F7; --ink-2: #999CA8; --line: #2B2E36; --accent: #8A88FF; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.5; padding: 48px 20px; }
main { max-width: 720px; margin: 0 auto; display: grid; gap: 24px; }
h1 { font-size: 24px; margin: 0; }
p.lede { margin: 6px 0 0; color: var(--ink-2); font-size: 14px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
a.item { display: grid; gap: 4px; padding: 16px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; }
a.item:hover, a.item:focus-visible { border-color: var(--accent); outline: none; }
.item b { font-size: 16px; }
.item span { font-size: 13px; color: var(--ink-2); }
.meta { display: flex; gap: 8px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <header>
    <h1>지연의 공유 페이지</h1>
    <p class="lede">Manta 기획·디자인 검토용으로 공유하는 페이지 모음이에요.</p>
  </header>
  <ul>
    <li>
      <a class="item" href="pull-trigger/">
        <b>다음 화 당김 표시 시안</b>
        <span>회차 끝에서 끌어올릴 때 "지금 놓으면 다음 화로 넘어간다"를 보여주는 5가지 방법 비교. 직접 당겨볼 수 있어요.</span>
        <div class="meta"><span>2026-10-14</span><span>·</span><span>다음 화 전환경험 개선</span></div>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
