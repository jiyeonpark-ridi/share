<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Jiyeon's Handoff Lab</title>
<meta name="description" content="직접 개발한 디자인 시안과 인터랙션 프로토타입을 모아둔 공간이에요.">
<meta property="og:title" content="Jiyeon's Handoff Lab">
<meta property="og:description" content="직접 개발한 디자인 시안과 인터랙션 프로토타입을 모아둔 공간이에요.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/home.css">
<script type="module" src="assets/js/home.js"></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <section class="hero">
      <h1 class="hero__title">Be Realistic,<br>Prototype the <em>impossible</em></h1>
      <p class="hero__desc">직접 개발한 디자인 시안과 인터랙션 프로토타입을 모아둔 공간이에요.</p>
    </section>

    <div class="home-body">
      <aside class="filter" aria-label="상태 필터">
        <p class="filter__label">상태</p>
        <ul class="filter__list" id="status-filter"></ul>
      </aside>

      <section aria-labelledby="project-count">
        <label class="field">
          <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input class="field__input" id="project-search" type="search" placeholder="프로젝트 이름으로 찾기" autocomplete="off">
        </label>
        <div class="list-head">
          <h2 class="list-head__count" id="project-count">프로젝트</h2>
          <select class="select" id="project-sort" aria-label="정렬">
            <option value="updated">최근 업데이트순</option>
            <option value="name">이름순</option>
          </select>
        </div>
        <ul id="project-list"></ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><p class="site-footer__inner">© 2026 Jiyeon's Handoff Lab</p></div>
  </footer>
</body>
</html>
